<!DOCTYPE html>

<html>
    <head>
        <title>North Star Bakery</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="css/styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="header">
            <img src="images/bakery-logo_c.png" alt="North Star Bakery logo" height="100" width="100">
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="/">Home</a></li>
                    <li><a href="/products.html">View Our Products</a></li>
                    <li><a href="/contact.html">Contact Us</a></li>
                    <li><a href="/about.html">Learn About Us</a></li>
                </ul>
            </nav>
        </header>

        <main class="contact">
            <section class="card">
                <h1>Contact Us!</h1>
                <h2>Inquiry and pre order requests</h2>
                <form action="/contact" class="contact-form">
                    <fieldset>
                        <legend>Contact Information</legend>
                        <label>Enter your name:</label>
                        <input type="text" name="name" required />
                        <label>Enter your email:</label>
                        <input type="email" name="email" required />
                    </fieldset>
                    <fieldset>
                        <legend>Inquiry or pre order request</legend>
                        <label>Enter your message:</label>
                        <textarea name="inquiry"></textarea>
                    </fieldset>
                    <fieldset>
                        <legend>Send us the message!</legend>
                        <input type="submit" value="Send message" />
                    </fieldset>
                </form>
            </section>
            <section class="card visit-us">
                <h2>Or visit us here!</h2>
                <p>123 Main St.</p>
                <p>City, State 12345</p>
                <figure>
                    <img src="images/bakery-storefront_c.png" alt="" height="480" width="720">
                    <figcaption>Our storefront!</figcaption>
                </figure>
            </section>
        </main>
    </body>
</html>
